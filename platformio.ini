; ─────────────────────────────────────────────────────────────────────────────
; CarrIoT — ESP32-S3-CAM-N16R8
; Servos SG90 rotación continua (GPIO 14 izq | GPIO 21 der)
; Cámara OV2640 · MQTT/TLS · OTA via HTTPS S3
; ─────────────────────────────────────────────────────────────────────────────
[platformio]
default_envs = cam

[env:cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 16 MB Flash QIO + 8 MB PSRAM OPI (N16R8)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

build_flags =
	-DBOARD_HAS_PSRAM
	-DFIRMWARE_VERSION='"v1.0.0"'
	-DCORE_DEBUG_LEVEL=1

lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21.3

extra_scripts = pre:scripts/add_env_defines.py
