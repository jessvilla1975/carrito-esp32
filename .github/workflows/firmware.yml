name: Firmware CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. COMPILACIÓN  (corre en cada push y PR)
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Compilar firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Compilar (env:cam)
        env:
          MQTT_SERVER:    ${{ secrets.MQTT_SERVER }}
          MQTT_SERVER_IP: ${{ secrets.MQTT_SERVER_IP }}
          MQTT_PORT:      ${{ secrets.MQTT_PORT }}
          MQTT_USER:      ${{ secrets.MQTT_USER }}
          MQTT_PASSWORD:  ${{ secrets.MQTT_PASSWORD }}
          WIFI_SSID:      ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD:  ${{ secrets.WIFI_PASSWORD }}
        run: pio run -e cam

      - name: Subir firmware como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: .pio/build/cam/firmware.bin
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # 2. PUBLICAR EN S3  (solo cuando se crea un tag vX.Y.Z)
  # ─────────────────────────────────────────────────────────────────
  publish-s3:
    name: Publicar en S3
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Subir firmware a S3
        run: |
          aws s3 cp firmware.bin \
            s3://${{ secrets.S3_BUCKET_NAME }}/esp32-cam/${{ github.ref_name }}/firmware.bin \
            --no-progress

          echo "Firmware disponible en:"
          echo "https://${{ secrets.S3_BUCKET_NAME }}.s3.amazonaws.com/esp32-cam/${{ github.ref_name }}/firmware.bin"

      - name: Publicar notificación OTA por MQTT (opcional)
        if: ${{ secrets.MQTT_SERVER != '' }}
        env:
          MQTT_SERVER:   ${{ secrets.MQTT_SERVER }}
          MQTT_PORT:     ${{ secrets.MQTT_PORT }}
          MQTT_USER:     ${{ secrets.MQTT_USER }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          S3_BUCKET:     ${{ secrets.S3_BUCKET_NAME }}
          VERSION:       ${{ github.ref_name }}
        run: |
          pip install paho-mqtt --quiet
          python3 - <<'EOF'
          import paho.mqtt.publish as publish
          import os, json

          version = os.environ["VERSION"]
          bucket  = os.environ["S3_BUCKET"]
          url     = f"https://{bucket}.s3.amazonaws.com/esp32-cam/{version}/firmware.bin"
          payload = json.dumps({"url": url, "version": version})

          publish.single(
              topic    = "carrito/ota/update",
              payload  = payload,
              hostname = os.environ["MQTT_SERVER"],
              port     = int(os.environ.get("MQTT_PORT", "8883")),
              auth     = {"username": os.environ["MQTT_USER"],
                          "password": os.environ["MQTT_PASSWORD"]},
              tls      = {"tls_version": None},
          )
          print(f"OTA publicado: {payload}")
          EOF
