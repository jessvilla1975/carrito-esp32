; ─────────────────────────────────────────────────────────────────────────────
; CarrIoT — ESP32-S3-DevKitC-1 V1.0
; Servos SG90 rotación continua (GPIO 20 izq | GPIO 21 der)
; Sensor HC-SR04 (TRIG GPIO 38 | ECHO GPIO 39)
; MQTT/TLS · OTA desde AWS S3
; ─────────────────────────────────────────────────────────────────────────────
[platformio]
default_envs = carrito

[env:carrito]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv

build_flags =
	-DFIRMWARE_VERSION='"v1.0.0"'
	-DCORE_DEBUG_LEVEL=1

lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21.3

extra_scripts = pre:scripts/add_env_defines.py
